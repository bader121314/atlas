openapi: 3.1.0
info:
  title: Atlas implemented API
  version: 0.0.0
  description: Only the routes below are implemented. Product routes remain in openapi-starter.yaml as design requirements. State-changing requests must send an Origin header equal to the configured web origin, otherwise 403.
servers:
  - url: /v1
paths:
  /health/live:
    get:
      operationId: getLiveness
      security: []
      responses:
        '200':
          description: Process is responding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /health/ready:
    get:
      operationId: getReadiness
      security: []
      responses:
        '200':
          description: PostgreSQL and Redis are reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: A required dependency is unavailable
          content:
            application/problem+json:
              schema:
                type: object
                required: [type, title, status]
                properties:
                  type: { type: string }
                  title: { type: string }
                  status: { type: integer, const: 503 }
  /auth/signup:
    post:
      operationId: signup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupRequest' }
      responses:
        '202':
          description: Accepted. Identical whether or not the email already has an account; a verification email is sent only for new accounts.
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Problem' }
  /auth/resend-verification:
    post:
      operationId: resendVerification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 320 }
      responses:
        '202':
          description: Accepted. Identical for unknown, verified and unverified emails; only unverified accounts receive a new link.
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Problem' }
  /auth/verify-email:
    post:
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string, maxLength: 128 }
      responses:
        '204': { description: Email verified }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Problem' }
  /auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '204':
          description: Signed in. Sets the HttpOnly session cookie.
          headers:
            Set-Cookie: { schema: { type: string } }
        '400': { $ref: '#/components/responses/Problem' }
        '401':
          description: Unknown email, wrong password, unverified or disabled account; indistinguishable by design.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Problem' }
  /auth/logout:
    post:
      operationId: logout
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Session revoked and cookie cleared }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /auth/session:
    get:
      operationId: getSession
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: The signed-in user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Problem' }
  /auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 320 }
      responses:
        '202':
          description: Accepted. Identical for every email; only verified, active accounts receive a link.
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Problem' }
  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, password]
              properties:
                token: { type: string, maxLength: 128 }
                password: { type: string, minLength: 12, maxLength: 128 }
      responses:
        '204': { description: Password changed and every session revoked }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Problem' }
  /auth/sessions:
    get:
      operationId: listSessions
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: The caller's active sessions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionList' }
        '401': { $ref: '#/components/responses/Problem' }
  /auth/sessions/revoke-others:
    post:
      operationId: revokeOtherSessions
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Every session except the current one revoked }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /auth/sessions/{id}:
    delete:
      operationId: revokeSession
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Session revoked }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404':
          description: Unknown, malformed or another user's session; indistinguishable by design.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /organizations:
    get:
      operationId: listOrganizations
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Organizations where the caller has an active membership
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [organizations]
                properties:
                  organizations:
                    type: array
                    items: { $ref: '#/components/schemas/Organization' }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createOrganization
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, slug]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                slug: { $ref: '#/components/schemas/Slug' }
      responses:
        '201':
          description: Created; the caller is its owner
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /organizations/{slug}:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      operationId: getOrganization
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: The organization and the caller's role
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFoundOrNotMember' }
    patch:
      operationId: updateOrganization
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '200':
          description: Updated (owner or admin)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFoundOrNotMember' }
  /organizations/{slug}/members:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      operationId: listMembers
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Active members (owner, admin or member; not guests)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [members]
                properties:
                  members:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [userId, displayName, email, role, joinedAt]
                      properties:
                        userId: { type: string, format: uuid }
                        displayName: { type: string }
                        email: { type: string }
                        role: { $ref: '#/components/schemas/OrganizationRole' }
                        joinedAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFoundOrNotMember' }
  /organizations/{slug}/invitations:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      operationId: listInvitations
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Outstanding invitations (owner or admin)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [invitations]
                properties:
                  invitations:
                    type: array
                    items: { $ref: '#/components/schemas/Invitation' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFoundOrNotMember' }
    post:
      operationId: createInvitation
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, role]
              properties:
                email: { type: string, format: email, maxLength: 320 }
                role: { type: string, enum: [admin, member, guest] }
      responses:
        '201':
          description: Invitation created and emailed; replaces any earlier invitation for the same email
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403':
          description: Not allowed to invite, or an admin inviting an admin
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/NotFoundOrNotMember' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /organizations/{slug}/invitations/{id}:
    parameters:
      - $ref: '#/components/parameters/Slug'
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    delete:
      operationId: revokeInvitation
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Invitation revoked }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFoundOrNotMember' }
  /organizations/{slug}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/Slug'
      - {
          name: userId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    patch:
      operationId: changeMemberRole
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/OrganizationRole' }
      responses:
        '200':
          description: Role changed
          content:
            application/json:
              schema:
                type: object
                required: [role]
                properties:
                  role: { $ref: '#/components/schemas/OrganizationRole' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFoundOrNotMember' }
        '409':
          description: The change would leave the organization without an active owner
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      operationId: removeMember
      security: [{ sessionCookie: [] }]
      description: Removes a member, or leaves the organization when userId is the caller.
      responses:
        '204': { description: Member removed; access ends immediately }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFoundOrNotMember' }
        '409': { $ref: '#/components/responses/Problem' }
  /invitations/accept:
    post:
      operationId: acceptInvitation
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string, maxLength: 128 }
      responses:
        '201':
          description: Joined; returns the organization with the new role
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '400':
          description: Invalid, used, revoked, expired or someone else's invitation; indistinguishable by design.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /organizations/{slug}/projects:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      operationId: listProjects
      description: Projects the caller can see, each with the caller's effective role (ADR-018).
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Visible projects }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFoundOrNotMember' }
    post:
      operationId: createProject
      security: [{ sessionCookie: [] }]
      description: 'Body: key (^[A-Z][A-Z0-9]{1,9}$), name, description?, visibility? (organization | private). Owner, admin or member.'
      responses:
        '201': { description: Created; the caller manages it }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFoundOrNotMember' }
        '409': { $ref: '#/components/responses/Problem' }
  /organizations/{slug}/projects/{key}:
    parameters:
      - $ref: '#/components/parameters/Slug'
      - {
          name: key,
          in: path,
          required: true,
          schema: { type: string, pattern: '^[A-Z][A-Z0-9]{1,9}$' },
        }
    get:
      operationId: getProject
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: The project and the caller's role }
        '404':
          {
            description: Unknown project or no access; indistinguishable by design,
          }
    patch:
      operationId: updateProject
      security: [{ sessionCookie: [] }]
      description: 'Body: version (required), name?, description?, visibility?, status? (active | archived). Manager only.'
      responses:
        '200': { description: Updated; version incremented }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: Unknown project or no access }
        '409': { description: Stale version }
  /organizations/{slug}/projects/{key}/members:
    parameters:
      - $ref: '#/components/parameters/Slug'
      - { name: key, in: path, required: true, schema: { type: string } }
    get:
      operationId: listProjectMembers
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Explicit project roles }
  /organizations/{slug}/projects/{key}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/Slug'
      - { name: key, in: path, required: true, schema: { type: string } }
      - {
          name: userId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    put:
      operationId: setProjectMember
      security: [{ sessionCookie: [] }]
      description: 'Body: role (manager | editor | commenter | viewer). Guests may be at most commenter (400 otherwise). Manager only.'
      responses:
        '204': { description: Role set }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404':
          {
            description: Not an active member of this organization,
            or no access,
          }
    delete:
      operationId: removeProjectMember
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Explicit role removed }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: No explicit role, or no access }
  /organizations/{slug}/projects/{key}/states:
    post:
      operationId: createWorkflowState
      security: [{ sessionCookie: [] }]
      description: 'Body: label (1-50), category (todo | in_progress | done). Manager. Up to 20 states (409 beyond).'
      responses:
        '201':
          {
            description: 'Created at the end, with a stable key derived from the label',
          }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { description: State limit reached }
    get:
      operationId: listWorkflowStates
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: The project's workflow states in order }
        '404': { description: Unknown project or no access }
  /organizations/{slug}/projects/{key}/tasks:
    get:
      operationId: listTasks
      security: [{ sessionCookie: [] }]
      description: 'Query: state (key), assignee (me | none | uuid), priority, label (id), milestone (id | none), parent (task number | none), after (task number cursor), limit (1-100, default 50). Unknown parameters return 400.'
      responses:
        '200':
          {
            description: 'Tasks ordered by number, with nextCursor (null on the last page)',
          }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { description: Unknown project or no access }
    post:
      operationId: createTask
      security: [{ sessionCookie: [] }]
      description: 'Body: title, description?, stateId? (defaults to the first state), priority? (none | low | medium | high | urgent), assigneeId? (must be able to see the project), dueAt? (ISO 8601), parentNumber? (task in the same project). Editor or manager.'
      responses:
        '201': { description: 'Created with key PROJECT-N' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: Unknown project or no access }
        '409': { description: Project is archived }
  /organizations/{slug}/projects/{key}/tasks/{number}:
    get:
      operationId: getTask
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: The task }
        '404': { description: Unknown task or no access }
    patch:
      operationId: updateTask
      security: [{ sessionCookie: [] }]
      description: 'Body: version (required) plus any of title, description, stateId, priority, assigneeId (null clears), dueAt (null clears), parentNumber (null clears; loops and nesting beyond 5 levels return 400).'
      responses:
        '200': { description: Updated; version incremented }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: Unknown task or no access }
        '409': { description: Stale version or archived project }
  /organizations/{slug}/projects/{key}/tasks/{number}/comments:
    get:
      operationId: listComments
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          {
            description: 'Comments oldest first; deleted ones have body null and deleted true',
          }
        '404': { description: Unknown task or no access }
    post:
      operationId: createComment
      security: [{ sessionCookie: [] }]
      description: 'Body: body (1-10000 characters). Commenter, editor or manager.'
      responses:
        '201': { description: Created }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: Unknown task or no access }
  /organizations/{slug}/projects/{key}/tasks/{number}/comments/{id}:
    patch:
      operationId: editComment
      security: [{ sessionCookie: [] }]
      description: Author only.
      responses:
        '200': { description: Edited }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: Unknown or deleted comment }
    delete:
      operationId: deleteComment
      security: [{ sessionCookie: [] }]
      description: Author or project manager. Soft delete; returns the deleted entry.
      responses:
        '200': { description: Deleted }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: Unknown or already deleted comment }
  /organizations/{slug}/projects/{key}/tasks/{number}/activity:
    get:
      operationId: listTaskActivity
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          {
            description: 'Activity oldest first: action, actor, field-level changes, time',
          }
        '404': { description: Unknown task or no access }
  /organizations/{slug}/labels:
    get:
      operationId: listLabels
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Organization labels by name }
    post:
      operationId: createLabel
      security: [{ sessionCookie: [] }]
      description: 'Body: name (1-40), color? (slate | sea | sage | sand | rose | violet). Owner, admin or member.'
      responses:
        '201': { description: Created }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { description: Name already used (case-insensitive) }
  /organizations/{slug}/labels/{id}:
    delete:
      operationId: deleteLabel
      security: [{ sessionCookie: [] }]
      description: Owner or admin. Also removes the label from every task.
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: Unknown label }
  /organizations/{slug}/projects/{key}/tasks/{number}/labels:
    put:
      operationId: setTaskLabels
      security: [{ sessionCookie: [] }]
      description: 'Body: labelIds (up to 20, organization labels only). Replaces the set and increments the task version.'
      responses:
        '200': { description: The updated task }
        '400':
          { description: A label is unknown or belongs to another organization }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: Unknown task or no access }
  /organizations/{slug}/projects/{key}/states/order:
    put:
      operationId: reorderWorkflowStates
      security: [{ sessionCookie: [] }]
      description: 'Body: stateIds listing every state exactly once. Manager.'
      responses:
        '200': { description: States in the new order }
        '400': { description: Missing, duplicate or foreign state ids }
  /organizations/{slug}/projects/{key}/states/{id}:
    patch:
      operationId: updateWorkflowState
      security: [{ sessionCookie: [] }]
      description: 'Body: label?, category?. Changing category updates completion of its tasks. Manager.'
      responses:
        '200': { description: Updated }
        '404': { description: Unknown state }
    delete:
      operationId: deleteWorkflowState
      security: [{ sessionCookie: [] }]
      description: 'Query: moveTo (required if the state has tasks). Manager.'
      responses:
        '204': { description: Deleted; tasks moved }
        '400': { description: moveTo is unknown or the state itself }
        '409':
          {
            description: Tasks exist and no moveTo was given,
            or it is the last state,
          }
  /organizations/{slug}/projects/{key}/tasks/{number}/dependencies:
    get:
      operationId: getTaskDependencies
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          {
            description: 'blockedBy and blocking lists: number, key, title, done',
          }
    post:
      operationId: addTaskDependency
      security: [{ sessionCookie: [] }]
      description: 'Body: blockerNumber (a task in the same project). Editor or manager.'
      responses:
        '204': { description: Recorded }
        '400': { description: Unknown task, the task itself, or a loop }
        '409': { description: Already recorded }
  /organizations/{slug}/projects/{key}/tasks/{number}/dependencies/{blocker}:
    delete:
      operationId: removeTaskDependency
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Removed }
        '404': { description: No such dependency }
  /organizations/{slug}/projects/{key}/milestones:
    get:
      operationId: listMilestones
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: 'Milestones with taskCount and doneCount' }
    post:
      operationId: createMilestone
      security: [{ sessionCookie: [] }]
      description: 'Body: title, dueAt?. Manager.'
      responses:
        '201': { description: Created }
        '403': { $ref: '#/components/responses/Problem' }
  /organizations/{slug}/projects/{key}/milestones/{id}:
    patch:
      operationId: updateMilestone
      security: [{ sessionCookie: [] }]
      description: 'Body: title?, dueAt? (null clears), status? (open | closed). Manager.'
      responses:
        '200': { description: Updated }
        '404': { description: Unknown milestone }
    delete:
      operationId: deleteMilestone
      security: [{ sessionCookie: [] }]
      description: Manager. Tasks keep existing without a milestone.
      responses:
        '204': { description: Deleted }
        '404': { description: Unknown milestone }
  /organizations/{slug}/projects/{key}/views:
    get:
      operationId: listSavedViews
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          { description: "The caller's views and the project's shared views" }
    post:
      operationId: createSavedView
      security: [{ sessionCookie: [] }]
      description: 'Body: name (1-60), shared?, config { layout (board | list | table | calendar), filters? { state, assignee, priority, label, milestone }, sort? { field, direction } }.'
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/Problem' }
        '409':
          { description: Name already used by the caller, or 50-view limit }
  /organizations/{slug}/projects/{key}/views/{id}:
    delete:
      operationId: deleteSavedView
      security: [{ sessionCookie: [] }]
      description: Owner, or a project manager for shared views.
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: "Unknown, or someone else's private view" }
  /organizations/{slug}/projects/{key}/fields:
    get:
      operationId: listCustomFields
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: 'Fields: id, name, type, options, position' }
    post:
      operationId: createCustomField
      security: [{ sessionCookie: [] }]
      description: 'Body: name (1-40), type (text | number | date | select), options (1-30 unique choices, select only). Manager. ADR-026.'
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/Problem' }
        '409':
          { description: Name already used in the project, or 20-field limit }
  /organizations/{slug}/projects/{key}/fields/{id}:
    patch:
      operationId: updateCustomField
      security: [{ sessionCookie: [] }]
      description: 'Body: name?, options? (select only; values using a removed choice are cleared). The type never changes. Manager.'
      responses:
        '200': { description: Updated }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { description: Unknown field }
    delete:
      operationId: deleteCustomField
      security: [{ sessionCookie: [] }]
      description: Manager. Removes the field's value from every task.
      responses:
        '204': { description: Deleted }
        '404': { description: Unknown field }
  /organizations/{slug}/projects/{key}/tasks/{number}/fields/{id}:
    put:
      operationId: setTaskFieldValue
      security: [{ sessionCookie: [] }]
      description: 'Body: value (string, number, or null to clear), checked against the field type. Editor. Bumps the task version and returns the task, whose fields map holds { fieldId: value }.'
      responses:
        '200': { description: The updated task }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { description: Unknown task, or a field of another project }
  /organizations/{slug}/projects/{key}/events:
    get:
      operationId: streamProjectEvents
      security: [{ sessionCookie: [] }]
      description: 'Server-Sent Events (ADR-029). Frames: `task` (id is the event id; data is { id, type, organizationId, projectId, taskId, version, actorUserId, occurredAt }), `ready` after any replay, `resync` when missed events cannot be replayed (refetch), `revoked` when access ends (the stream closes). Send Last-Event-ID to replay events missed in the last 24 hours. Any project role.'
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: An open event stream
          content:
            text/event-stream: { schema: { type: string } }
        '401': { description: Not signed in }
        '404': { $ref: '#/components/responses/NotFoundOrNotMember' }
        '503': { description: Event delivery is unavailable; retry }
  /organizations/{slug}/projects/{key}/tasks/{number}/presence:
    put:
      operationId: heartbeatPresence
      security: [{ sessionCookie: [] }]
      description: 'Marks the caller as viewing the task for 45 seconds and returns { viewers: [{ userId, displayName }] }. Any project role. ADR-030.'
      responses:
        '200': { description: Everyone viewing the task, the caller included }
        '404': { description: Unknown task, or no access }
        '503': { description: Presence is unavailable }
    delete:
      operationId: leavePresence
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: The caller is no longer shown }
  /organizations/{slug}/notifications:
    get:
      operationId: listNotifications
      security: [{ sessionCookie: [] }]
      description: "The caller's latest 50 notifications in this organization, newest first; ?unread=true for unread only. Each is { id, kind (task.assigned | comment.created), actor, task { key, projectKey, number, title }, createdAt, readAt }. Notifications about projects the caller can no longer read are hidden. ADR-031."
      responses:
        '200': { description: Notifications }
        '404': { $ref: '#/components/responses/NotFoundOrNotMember' }
  /organizations/{slug}/notifications/unread-count:
    get:
      operationId: countUnreadNotifications
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: '{ count }' }
  /organizations/{slug}/notifications/read:
    post:
      operationId: markNotificationsRead
      security: [{ sessionCookie: [] }]
      description: "Body: { ids: [uuid] (1-100) } or { all: true }. Ids that are not the caller's are ignored."
      responses:
        '204': { description: Marked read }
        '400': { $ref: '#/components/responses/Problem' }
  /organizations/{slug}/notification-settings:
    get:
      operationId: getNotificationSettings
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: '{ email: boolean } (default true)' }
    put:
      operationId: updateNotificationSettings
      security: [{ sessionCookie: [] }]
      description: 'Body: { email: boolean }.'
      responses:
        '200': { description: The saved settings }
  /organizations/{slug}/search:
    get:
      operationId: search
      security: [{ sessionCookie: [] }]
      description: '?q= (1-200 characters). Tasks whose title, description or comments contain every word as a prefix, or the task with that key (NW-12), in projects the caller can read; at most 30, best first. Each is { key, projectKey, projectName, number, title, state, matchedIn (task | comment) }. ADR-032.'
      responses:
        '200': { description: Matching tasks }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFoundOrNotMember' }
  /organizations/{slug}/projects/{key}/analytics:
    get:
      operationId: projectAnalytics
      security: [{ sessionCookie: [] }]
      description: '{ total, done, overdue, unassigned, byState [{ stateId, label, category, count }], weeks [{ weekStart, created, completed }] (8, UTC Mondays), medianLeadDays (null when none finished in 90 days), openByAssignee [{ userId, displayName, open }] }. Any project role. ADR-033.'
      responses:
        '200': { description: Project numbers }
        '404': { description: Unknown project, or no access }
  /organizations/{slug}/projects/{key}/tasks/{number}/attachments:
    get:
      operationId: listAttachments
      security: [{ sessionCookie: [] }]
      description: 'Uploaded attachments with status (quarantined, clean, rejected). ADR-034.'
      responses:
        '200': { description: Attachments }
    post:
      operationId: createAttachment
      security: [{ sessionCookie: [] }]
      description: 'Body: filename, contentType (image/png | image/jpeg | image/gif | image/webp | application/pdf | text/plain | text/csv), size (bytes, at most 10 MB). Returns { attachment, upload { url, headers } }: PUT the file to url with those headers within five minutes, then call complete. Editor.'
      responses:
        '201': { description: Pending attachment and upload URL }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { description: 20-attachment limit }
        '503': { description: Storage is not configured }
  /organizations/{slug}/projects/{key}/attachments/{id}/complete:
    post:
      operationId: completeAttachment
      security: [{ sessionCookie: [] }]
      description: The uploader confirms the upload; the stored size must match. The file is quarantined until checked.
      responses:
        '200': { description: The quarantined attachment }
        '422': { description: Missing upload, or the size differs (rejected) }
  /organizations/{slug}/projects/{key}/attachments/{id}/download:
    get:
      operationId: downloadAttachment
      security: [{ sessionCookie: [] }]
      responses:
        '302': { description: Redirect to a one-minute signed download URL }
        '409': { description: Not checked yet, or rejected }
  /organizations/{slug}/projects/{key}/attachments/{id}:
    delete:
      operationId: deleteAttachment
      security: [{ sessionCookie: [] }]
      description: The uploader or a project manager.
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Problem' }
  /organizations/{slug}/projects/{key}/exports:
    get:
      operationId: listExports
      security: [{ sessionCookie: [] }]
      description: "The caller's ten latest exports of this project: { id, status (queued | ready | failed | expired), rowCount, createdAt, expiresAt }. Managers and editors. ADR-035."
      responses:
        '200': { description: Exports }
    post:
      operationId: requestExport
      security: [{ sessionCookie: [] }]
      description: Queues a CSV export of every task; the worker builds it. Managers and editors.
      responses:
        '201': { description: The queued export }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { description: Three exports are already waiting }
        '503': { description: Storage is not configured }
  /organizations/{slug}/projects/{key}/exports/{id}/download:
    get:
      operationId: downloadExport
      security: [{ sessionCookie: [] }]
      description: The requester only, for 24 hours after it is ready.
      responses:
        '302': { description: Redirect to a one-minute signed download URL }
        '404': { description: Unknown, or someone else's export }
        '409': { description: Not ready yet, or failed }
        '410': { description: Expired }
  /organizations/{slug}/webhooks:
    get:
      operationId: listWebhooks
      security: [{ sessionCookie: [] }]
      description: 'Endpoints: { id, url, description, events, status (active | paused), consecutiveFailures, createdAt }. Owners and admins. ADR-036.'
      responses:
        '200': { description: Endpoints }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createWebhook
      security: [{ sessionCookie: [] }]
      description: 'Body: url (https, public), description?, events (task.created | task.updated | comment.created). Returns { endpoint, secret }; the secret is shown only here.'
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/Problem' }
        '503': { description: Webhooks are not configured }
  /organizations/{slug}/webhooks/{id}:
    patch:
      operationId: updateWebhook
      security: [{ sessionCookie: [] }]
      description: 'Body: url?, description?, events?, status? (resuming resets the failure count).'
      responses:
        '200': { description: Updated }
    delete:
      operationId: deleteWebhook
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Deleted with its history }
  /organizations/{slug}/webhooks/{id}/deliveries:
    get:
      operationId: listWebhookDeliveries
      security: [{ sessionCookie: [] }]
      description: 'Latest 50: { id, eventId, eventType, status (pending | delivered | failed), attempts, lastStatusCode, lastError, createdAt, deliveredAt }.'
      responses:
        '200': { description: Deliveries }
  /organizations/{slug}/webhooks/{id}/deliveries/{deliveryId}/replay:
    post:
      operationId: replayWebhookDelivery
      security: [{ sessionCookie: [] }]
      description: Sends the delivery again with the same event id.
      responses:
        '202': { description: Queued }
  /organizations/{slug}/webhooks/{id}/ping:
    post:
      operationId: pingWebhook
      security: [{ sessionCookie: [] }]
      description: Queues a webhook.ping event to the endpoint.
      responses:
        '202': { description: Queued }
  /organizations/{slug}/api-tokens:
    get:
      operationId: listApiTokens
      security: [{ sessionCookie: [] }]
      description: "The caller's active tokens: { id, name, prefix, scopes, createdAt, expiresAt, lastUsedAt }. Signed-in browsers only; not guests. ADR-037."
      responses:
        '200': { description: Tokens }
    post:
      operationId: createApiToken
      security: [{ sessionCookie: [] }]
      description: 'Body: name, scopes (tasks:read, tasks:write), expiresInDays (1-365, default 90). Returns { token, secret }; the secret is shown only here. Use it as Authorization: Bearer <secret> on task routes.'
      responses:
        '201': { description: Created }
        '403': { description: Guests, or called with a token }
        '409': { description: 20-token limit }
  /organizations/{slug}/api-tokens/{id}:
    delete:
      operationId: revokeApiToken
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Revoked at once }
components:
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Slug' }
  securitySchemes:
    apiToken:
      type: http
      scheme: bearer
      description: Scoped personal API token (atl_...), accepted on task routes only. ADR-037.
    sessionCookie:
      type: apiKey
      in: cookie
      name: atlas_session
      description: Opaque session token. Named __Host-atlas_session in production.
  responses:
    NotFoundOrNotMember:
      description: Unknown organization, or the caller is not an active member; indistinguishable by design.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Rate limit exceeded (ADR-012)
      headers:
        Retry-After:
          description: Seconds until the limit resets
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Problem:
      description: RFC 9457 problem response without internal details
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, service]
      properties:
        status: { type: string, const: ok }
        service: { type: string, enum: [api, worker, web] }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
    SignupRequest:
      type: object
      additionalProperties: false
      required: [email, password, displayName]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 12, maxLength: 128 }
        displayName: { type: string, minLength: 1, maxLength: 100 }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 1, maxLength: 128 }
    Session:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          type: object
          additionalProperties: false
          required: [id, email, displayName]
          properties:
            id: { type: string, format: uuid }
            email: { type: string }
            displayName: { type: string }
    SessionList:
      type: object
      additionalProperties: false
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, current, issuedAt, lastSeenAt, expiresAt, userAgent]
            properties:
              id: { type: string, format: uuid }
              current: { type: boolean }
              issuedAt: { type: string, format: date-time }
              lastSeenAt: { type: [string, 'null'], format: date-time }
              expiresAt: { type: string, format: date-time }
              userAgent: { type: [string, 'null'] }
    Slug:
      type: string
      minLength: 3
      maxLength: 63
      pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
    OrganizationRole:
      type: string
      enum: [owner, admin, member, guest]
    Organization:
      type: object
      additionalProperties: false
      required: [id, slug, name, role, createdAt]
      properties:
        id: { type: string, format: uuid }
        slug: { $ref: '#/components/schemas/Slug' }
        name: { type: string }
        role: { $ref: '#/components/schemas/OrganizationRole' }
        createdAt: { type: string, format: date-time }
    Invitation:
      type: object
      additionalProperties: false
      required: [id, email, role, invitedBy, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { type: string, enum: [admin, member, guest] }
        invitedBy: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
