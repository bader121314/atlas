name: Release drill
# Rebuilds the stack from the repository, upgrades from the previous
# release, rolls back, and restores a backup (ADR-044).
on:
  push:
    branches: [main]
  pull_request:
    paths:
      [
        'infrastructure/**',
        'scripts/release-drill.sh',
        '.github/workflows/release-drill.yml',
        'packages/database/**',
      ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run the drill against the previous commit on main
        run: |
          previous=$(git rev-parse HEAD~1)
          if [ "${{ github.event_name }}" = pull_request ]; then previous=$(git rev-parse origin/main); fi
          scripts/release-drill.sh HEAD "$previous"
