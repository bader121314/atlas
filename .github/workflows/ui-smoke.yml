name: UI smoke
on:
  pull_request:
    paths:
      [
        'apps/web/**',
        'apps/api/**',
        'packages/**',
        'scripts/ui-smoke.cjs',
        'scripts/demo-*',
        '.github/workflows/ui-smoke.yml',
      ]
  push:
    branches: [main]
    paths:
      [
        'apps/web/**',
        'apps/api/**',
        'packages/**',
        'scripts/ui-smoke.cjs',
        'scripts/demo-*',
        '.github/workflows/ui-smoke.yml',
      ]
  workflow_dispatch:
    inputs:
      print_screenshots:
        description: Print the demo screenshots in the job log
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.7-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: atlas
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U atlas -d atlas" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4.7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://atlas:ephemeral-ci-only@127.0.0.1:5432/atlas
      REDIS_URL: redis://127.0.0.1:6379
      SESSION_SECRET: ephemeral-ci-only-session-secret-0123456789
      WEB_ORIGIN: http://127.0.0.1:3000
      API_PORT: '3001'
      NOTIFICATION_EMAIL_DELAY_MS: '0'
      # Attachments go to an S3 test double started below (ADR-034).
      STORAGE_ENDPOINT: http://127.0.0.1:9100
      STORAGE_BUCKET: atlas-smoke
      STORAGE_ACCESS_KEY: smoke-key
      STORAGE_SECRET_KEY: smoke-secret
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: pnpm build
      - name: Install Playwright and axe-core (smoke test only, not project dependencies)
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright axe-core
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Start API and web
        run: |
          node -e "require('./packages/shared/dist/testing/fake-s3.js').startFakeS3({ accessKey: 'smoke-key', secretKey: 'smoke-secret' }, { port: 9100, bucket: 'atlas-smoke' })" > s3.log 2>&1 &
          node apps/api/dist/main.js > api.log 2>&1 &
          node apps/worker/dist/main.js > worker.log 2>&1 &
          (cd apps/web && npx next start --hostname 127.0.0.1 --port 3000) > web.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3001/v1/health/live >/dev/null 2>&1 &&
            curl -fsS http://127.0.0.1:3002/v1/health/live >/dev/null 2>&1 &&
            curl -fsS http://127.0.0.1:3000/health/live >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo 'services did not start'; cat api.log web.log worker.log; exit 1
      - name: Drive the browser
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          API_LOG: api.log
          SCREENSHOT_DIR: screenshots
        run: node scripts/ui-smoke.cjs
      - name: Seed the demo organization and capture its screenshots
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          ATLAS_API: http://127.0.0.1:3001/v1
          PRINT_SCREENSHOTS: ${{ inputs.print_screenshots == true }}
        run: |
          output=$(node scripts/demo-seed.mjs)
          echo "$output" | grep -v 'Demo sign-in'
          export DEMO_PASSWORD=$(echo "$output" | sed -n 's/^Demo sign-in: [^ ]* \/ //p')
          node scripts/demo-screenshots.cjs
          # Seeding twice leaves the data alone.
          node scripts/demo-seed.mjs | grep -q 'already exists'
      - name: Server logs on failure
        if: failure()
        run: tail -n 100 api.log web.log worker.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 14
