name: M0 checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.7-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: atlas
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U atlas -d atlas" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4.7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://atlas:ephemeral-ci-only@127.0.0.1:5432/atlas
      REDIS_URL: redis://127.0.0.1:6379
      SESSION_SECRET: ephemeral-ci-only-session-secret-0123456789
      WEB_ORIGIN: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:validate
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: pnpm test:integration
      - run: pnpm audit --prod --audit-level high
