name: Demo uptime
# Checks the public demo every hour (ADR-067). A failed run is emailed to
# the repository owner by GitHub's own Actions notifications.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEMO_URL: https://atlas.84-13-151-33.sslip.io
    steps:
      - name: Sign-in page and API answer
        run: |
          # Three tries a minute apart, so one slow moment (or the nightly
          # reset at 00:00 UTC) does not count as an outage.
          for attempt in 1 2 3; do
            if curl -fsS --max-time 20 "$DEMO_URL/login" -o /dev/null &&
               curl -fsS --max-time 20 "$DEMO_URL/api/health/ready" | grep -q '"status":"ok"'; then
              echo "Demo is up ($DEMO_URL)"
              exit 0
            fi
            echo "Attempt $attempt failed"
            sleep 60
          done
          echo "::error::The demo at $DEMO_URL is not answering"
          exit 1
