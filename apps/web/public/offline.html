<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1f5068" />
    <title>Offline – Atlas</title>
    <link rel="icon" href="/icons/icon.svg" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f3f6f4;
        color: #1d2a33;
        font-family: system-ui, sans-serif;
      }
      main {
        max-width: 28rem;
        padding: 2rem 1.5rem;
      }
      h1 {
        font-family: Georgia, serif;
        font-weight: 600;
      }
      p {
        color: #52616b;
        line-height: 1.5;
      }
      a {
        display: inline-block;
        margin-top: 0.5rem;
        padding: 0.6rem 1rem;
        border-radius: 6px;
        background: #2f6f8f;
        color: #ffffff;
        text-decoration: none;
        font-weight: 600;
      }
      a:focus-visible {
        outline: 3px solid #1f5068;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon.svg" alt="" width="56" height="56" />
      <h1>You are offline</h1>
      <p>
        Atlas needs a connection to show your work; nothing is stored on this
        device. Check your connection, then try again.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
