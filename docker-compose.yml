name: atlas-local
services:
  postgres:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports: ['127.0.0.1:5432:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.7-alpine
    ports: ['127.0.0.1:6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    build:
      context: ./infrastructure/local/minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes: ['minio-data:/data']
  mailpit:
    image: axllent/mailpit:v1.27.10
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']
  # Optional real malware scanning (ADR-065): `docker compose --profile scan
  # up -d`, then set CLAMD_HOST=127.0.0.1. It needs about 1.5 GB of memory
  # and a minute or two to download signatures on first start.
  clamav:
    image: clamav/clamav-debian:1.4
    profiles: [scan]
    ports: ['127.0.0.1:3310:3310']
    volumes: ['clamav-data:/var/lib/clamav']
volumes:
  postgres-data:
  minio-data:
  clamav-data:
